# Configuración propia de ventas-service: tiempos máximos del cliente Feign hacia catálogo
spring:
  cloud:
    openfeign:
      client:
        config:
          catalogo-service:
            connect-timeout: 2000   # máximo para establecer la conexión (ms)
            read-timeout: 3000      # máximo para recibir la respuesta (ms)
